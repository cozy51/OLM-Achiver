<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>メールを PDF 保存</title></head>
<body>
  <main>
    <div class="mark">PDF</div>
    <div><h1>Outlook Mail Archiver</h1><p>開いているメールを、元メールへのリンク付き PDF として保存します。</p></div>
  </main>
  <label for="sender">差出人名</label>
  <p class="hint">Outlookに表示されている差出人名をコピーし、ここへ貼り付けてください。</p>
  <div class="sender-row">
    <input id="sender" type="text" placeholder="例: 山田 太郎 (Yamada,T.)" autocomplete="off">
    <button id="paste" type="button" title="クリップボードから貼り付け">貼り付け</button>
  </div>
  <button id="save">📩 このメールを PDF 保存</button>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
