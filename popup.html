<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>メールを PDF 保存</title></head>
<body>
  <main>
    <div class="mark">PDF</div>
    <div><h1>Outlook Mail Archiver <span id="version" class="version"></span></h1><p>開いているメールを、元メールへのリンク付き PDF として保存します。</p></div>
  </main>
  <label for="sender">差出人名</label>
  <p class="hint" id="hint">差出人を自動検出しています…</p>
  <div class="sender-row">
    <input id="sender" type="text" placeholder="例: 山田 太郎 (Yamada,T.)" autocomplete="off">
    <button id="paste" type="button" title="クリップボードから貼り付け">貼り付け</button>
  </div>
  <label for="comment">コメント<span class="optional">(任意)</span></label>
  <p class="hint">ファイル名の先頭に {コメント} として入ります。</p>
  <input id="comment" class="comment" type="text" placeholder="例: 要対応" autocomplete="off" maxlength="80">
  <label class="option" for="markdown">
    <input id="markdown" type="checkbox">
    <span>Markdown (.md) も保存する<small>「ダウンロード」フォルダーへ自動で保存します</small></span>
  </label>
  <button id="save">📩 このメールを PDF 保存</button>
  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
